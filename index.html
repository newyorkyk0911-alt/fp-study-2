<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102b49"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="FP Study 2"><title>FP Study 2</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',sans-serif;color:#15263b;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}main{max-width:650px;margin:auto;padding:24px 17px 95px}.top{background:#102b49;color:white;padding:26px 22px;border-radius:22px;margin-bottom:20px}.top h1{font-size:27px;margin:0 0 5px}.top p{opacity:.8;margin:0}.card{background:white;border:1px solid #e2e8f0;border-radius:19px;padding:19px;margin:14px 0;box-shadow:0 4px 16px #172c4410}h2{font-size:19px;margin:0 0 15px}.muted{color:#60718a;font-size:13px}.pill{display:inline-block;background:#e7f0fc;color:#164c86;padding:5px 10px;border-radius:50px;font-size:12px;font-weight:700}.btn{background:#1465b8;color:white;border:0;border-radius:13px;padding:15px 18px;font-size:16px;font-weight:700;width:100%;cursor:pointer}.btn:disabled{opacity:.4}.secondary{background:#e9f1fa;color:#134c84}.choice{display:block;text-align:left;width:100%;padding:15px;margin:9px 0;border:1.5px solid #dbe4ef;background:white;border-radius:12px;font-size:15px;color:#15263b}.choice.selected{border-color:#176ec7;background:#eaf4ff}.choice.correct{border-color:#249769;background:#e9f9f0}.choice.wrong{border-color:#d95353;background:#fff0f0}.switch{display:flex;gap:8px}.switch button{flex:1;padding:12px;border-radius:12px;border:1px solid #dbe4ef;background:#fff;font-weight:700}.switch button.active{background:#102b49;color:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#f3f7fb;border-radius:12px;padding:15px}.stat strong{display:block;font-size:25px}.bar{height:8px;background:#e2e8f0;border-radius:10px;overflow:hidden}.bar span{display:block;height:100%;background:#1465b8}.row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:12px 0}.hide{display:none!important}.explain{background:#f1f7fe;border-radius:12px;padding:15px;line-height:1.7}.nav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #dce5ef;padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:10px}.nav button{border:0;background:#edf2f8;border-radius:10px;padding:11px 17px;font-weight:700;color:#34516e}.nav button.active{background:#102b49;color:white}select{width:100%;font-size:16px;padding:13px;border-radius:12px;border:1px solid #dbe4ef;background:white}.small{font-size:12px}.notice{border-left:3px solid #e7ad45;padding-left:10px;color:#6a573a;font-size:12px;line-height:1.6}</style></head><body><main><header class="top"><h1>FP Study 2</h1><p>毎日10問。着実に合格へ。</p></header><section id="home"><div class="card"><span class="pill">今日の学習</span><h2 style="margin-top:12px">出題形式を選ぶ</h2><div class="switch"><button id="tf" class="active" onclick="setMode('tf')">○×形式</button><button id="mc" onclick="setMode('mc')">4択形式</button></div><p class="muted">分野を選択（全分野または1分野）</p><select id="category"></select><p class="muted">収録問題から最大10問を出題します。</p><button class="btn" onclick="startQuiz(false)">10問演習を始める</button><button class="btn secondary" style="margin-top:10px" onclick="startQuiz(true)">間違えた問題を復習する</button></div><div class="card"><h2>学習サマリー</h2><div class="grid"><div class="stat"><span class="muted">累計解答数</span><strong id="total">0</strong></div><div class="stat"><span class="muted">累計正答率</span><strong id="rate">—</strong></div></div><p class="muted" id="last">まだ学習記録はありません。</p></div><p class="notice">本アプリは独自作成の練習問題です。試験の公式問題集ではありません。法改正・税制・最新の試験基準は必ず公式資料で確認してください。</p></section><section id="quiz" class="hide"><div class="card"><div class="row"><span class="pill" id="qcat"></span><span class="muted" id="progress"></span></div><div class="bar"><span id="fill" style="width:0"></span></div><h2 id="question" style="margin-top:22px;line-height:1.65"></h2><div id="options"></div><div id="feedback" class="hide explain"></div><button id="submit" class="btn" disabled onclick="submitAnswer()">解答する</button><button id="next" class="btn hide" onclick="nextQuestion()">次の問題へ</button></div></section><section id="result" class="hide"><div class="card"><span class="pill">演習結果</span><h2 style="margin-top:15px" id="resultTitle"></h2><p id="resultText"></p><button class="btn" onclick="show('home')">ホームに戻る</button></div></section><section id="stats" class="hide"><div class="card"><h2>6分野別の正答率</h2><div id="categoryStats"></div></div><div class="card"><h2>直近の学習履歴</h2><div id="history"></div><button class="btn secondary" onclick="exportData()">学習記録をJSONで書き出す</button></div></section></main><nav class="nav"><button id="navHome" class="active" onclick="show('home')">ホーム</button><button id="navStats" onclick="show('stats')">成績</button></nav><script>
const cats=['ライフプランニング','リスク管理','金融資産運用','タックスプランニング','不動産','相続・事業承継'];
// Each entry: category, statement, true/false correct, four choices, correct choice index, explanation.
const bank=[
[0,'国民年金は原則として20歳以上60歳未満の日本国内居住者が加入する。',true,['20歳以上60歳未満','18歳以上65歳未満','20歳以上65歳未満','18歳以上60歳未満'],0,'国民年金の強制加入対象は原則20歳以上60歳未満の国内居住者です。'],
[0,'老齢基礎年金は原則65歳から受給する。',true,['60歳','62歳','65歳','70歳'],2,'老齢基礎年金の原則の受給開始年齢は65歳です。'],
[0,'厚生年金保険の保険料は、原則として被保険者が全額負担する。',false,['被保険者が全額','事業主が全額','事業主と被保険者が折半','国が全額'],2,'厚生年金保険料は原則として労使折半です。'],
[1,'生命保険の契約者と保険料負担者が異なる場合、税金の種類は実際の保険料負担者などにより変わり得る。',true,['契約者名だけで決まる','実際の保険料負担者などで変わる','受取額だけで決まる','税金は必ず非課税'],1,'保険金の課税関係は保険料負担者、被保険者、受取人の組合せなどで決まります。'],
[1,'地震保険は火災保険と無関係に単独契約できる。',false,['常に単独契約できる','火災保険に付帯して契約する','自動車保険に付帯する','生命保険に付帯する'],1,'地震保険は原則として火災保険とセットで契約します。'],
[1,'一般に、定期保険は保険期間が定められた死亡保障である。',true,['満期がない終身保障','一定期間の死亡保障','医療費の実費補償','老後資金専用の積立'],1,'定期保険は一定期間の死亡保障を目的とする保険です。'],
[2,'一般に、市場金利が上昇すると既発の固定利付債券の価格は下落する。',true,['上昇する','下落する','必ず一定','額面に固定される'],1,'市場金利と既発固定利付債券価格は一般に逆方向に動きます。'],
[2,'分散投資をすれば投資元本の損失リスクはゼロになる。',false,['ゼロになる','リスクを抑える効果はあるがゼロにはならない','必ず利益が出る','手数料がゼロになる'],1,'分散投資はリスク軽減に役立ちますが元本保証ではありません。'],
[2,'100万円を年利2%で1年間、単利運用した場合の税引前利息は2万円である。',true,['2,000円','1万円','2万円','20万円'],2,'100万円×2%=2万円です。'],
[3,'所得税は原則として超過累進税率を採用している。',true,['比例税率のみ','超過累進税率','一律の定額税','非課税のみ'],1,'所得税の税率は課税所得の階層に応じて上がる超過累進税率です。'],
[3,'医療費控除は原則として年末調整のみで適用を受けられる。',false,['年末調整のみ','確定申告で適用を受ける','勤務先が自動計算','市役所で必ず現金還付'],1,'医療費控除は原則として確定申告で適用を受けます。'],
[3,'給与所得者であっても、一定の場合には確定申告が必要となる。',true,['一切必要ない','一定の場合に必要','全員必須','扶養家族がいる場合のみ'],1,'給与所得者でも副収入などの条件により確定申告が必要な場合があります。'],
[4,'不動産登記簿の権利部（甲区）には所有権に関する事項が記録される。',true,['建物の構造のみ','所有権に関する事項','抵当権のみ','固定資産税の税率'],1,'権利部（甲区）は所有権に関する登記を記録します。'],
[4,'不動産の売買契約は必ず公正証書で作成しなければ成立しない。',false,['必ず公正証書が必要','口頭の合意でも原則成立し得る','登記後にのみ成立','行政庁の許可が常に必要'],1,'売買契約は原則として当事者の合意で成立します。紛争防止のため書面化が重要です。'],
[4,'土地の公示価格は、原則として毎年1月1日時点の価格として公表される。',true,['1月1日','4月1日','7月1日','12月31日'],0,'地価公示の価格時点は毎年1月1日です。'],
[5,'法定相続人が配偶者と子の場合、配偶者の法定相続分は原則2分の1である。',true,['4分の1','3分の1','2分の1','3分の2'],2,'配偶者と子が相続人の場合、配偶者の法定相続分は1/2、子全体で1/2です。'],
[5,'遺言書が存在すれば、どのような内容でも遺留分の問題は一切生じない。',false,['遺留分の問題は生じない','遺留分侵害額請求の問題が生じ得る','遺言はすべて無効','相続税はかからない'],1,'遺言があっても一定の相続人には遺留分が認められる場合があります。'],
[5,'相続放棄は原則として自己のために相続開始があったことを知った時から3か月以内に家庭裁判所に申述する。',true,['1か月以内','3か月以内','1年以内','期限なし'],1,'相続放棄の熟慮期間は原則3か月です。']
];
const mcStems=["国民年金の強制加入対象となる年齢は、原則としてどれですか？", "老齢基礎年金の原則の受給開始年齢は？", "厚生年金保険料の原則的な負担方法は？", "生命保険金の課税関係について適切なのは？", "地震保険の契約方法について適切なのは？", "定期保険の説明として適切なのは？", "一般に市場金利が上昇すると既発の固定利付債券価格はどうなりますか？", "分散投資の効果として適切なのは？", "100万円を年利2%の単利で1年間運用した場合の税引前利息は？", "所得税の税率構造として適切なのは？", "医療費控除を受ける原則的な手続きは？", "給与所得者の確定申告について適切なのは？", "登記簿の権利部（甲区）に記録されるのは？", "不動産売買契約の成立について適切なのは？", "地価公示の価格時点は原則いつですか？", "配偶者と子が法定相続人の場合、配偶者の法定相続分は？", "遺言と遺留分について適切なのは？", "相続放棄の申述期間は原則としていつまでですか？"];
const KEY='fp-study-2-v1';let data;try{data=JSON.parse(localStorage.getItem(KEY))||{answers:[],sessions:[],wrong:[]}}catch{data={answers:[],sessions:[],wrong:[]}};data.answers||=[];data.sessions||=[];data.wrong||=[];
let mode='tf',quiz=[],idx=0,selected=-1,correctCount=0,review=false;
const el=id=>document.getElementById(id);const save=()=>localStorage.setItem(KEY,JSON.stringify(data));
function setMode(m){mode=m;el('tf').classList.toggle('active',m==='tf');el('mc').classList.toggle('active',m==='mc')}
function show(id){['home','quiz','result','stats'].forEach(x=>el(x).classList.toggle('hide',x!==id));el('navHome').classList.toggle('active',id!=='stats');el('navStats').classList.toggle('active',id==='stats');if(id==='home')renderHome();if(id==='stats')renderStats();window.scrollTo(0,0)}
function shuffle(a){return a.map(x=>({x,r:Math.random()})).sort((a,b)=>a.r-b.r).map(o=>o.x)}
function startQuiz(isReview){review=isReview;let cat=Number(el('category').value);let ids=bank.map((_,i)=>i).filter(i=>(cat===-1||bank[i][0]===cat)&&(!isReview||data.wrong.includes(i)));if(!ids.length){alert(isReview?'この分野には復習対象の問題がありません。':'問題がありません。');return}quiz=shuffle(ids).slice(0,10);idx=0;selected=-1;correctCount=0;show('quiz');renderQuestion()}
function renderQuestion(){let b=bank[quiz[idx]];el('qcat').textContent=cats[b[0]];el('progress').textContent=`${idx+1} / ${quiz.length} 問`;el('fill').style.width=`${idx/quiz.length*100}%`;el('question').textContent=mode==='tf'?b[1]:mcStems[quiz[idx]];let opts=mode==='tf'?['○ 正しい','× 誤り']:b[3];el('options').innerHTML='';opts.forEach((t,i)=>{let btn=document.createElement('button');btn.className='choice';btn.textContent=mode==='mc'?`${'ABCD'[i]}. ${t}`:t;btn.onclick=()=>{selected=i;document.querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===i));el('submit').disabled=false};el('options').append(btn)});selected=-1;el('submit').disabled=true;el('submit').classList.remove('hide');el('next').classList.add('hide');el('feedback').classList.add('hide')}
function submitAnswer(){let id=quiz[idx],b=bank[id],answer=mode==='tf'?(b[2]?0:1):b[4],ok=selected===answer;correctCount+=ok?1:0;data.answers.push({id,mode,ok,date:new Date().toISOString()});if(ok)data.wrong=data.wrong.filter(x=>x!==id);else if(!data.wrong.includes(id))data.wrong.push(id);save();document.querySelectorAll('.choice').forEach((x,i)=>{x.disabled=true;if(i===answer)x.classList.add('correct');else if(i===selected)x.classList.add('wrong')});el('feedback').innerHTML=`<strong>${ok?'✓ 正解':'✕ 不正解'}</strong><p>${b[5]}</p>`;el('feedback').classList.remove('hide');el('submit').classList.add('hide');el('next').classList.remove('hide');el('next').textContent=idx===quiz.length-1?'結果を見る':'次の問題へ';el('fill').style.width=`${(idx+1)/quiz.length*100}%`}
function nextQuestion(){if(++idx<quiz.length){renderQuestion();return}data.sessions.push({date:new Date().toISOString(),mode,review,count:quiz.length,correct:correctCount});save();el('resultTitle').textContent=`${correctCount} / ${quiz.length} 問正解`;el('resultText').textContent=`正答率 ${Math.round(correctCount/quiz.length*100)}%　${review?'復習':'通常演習'}を完了しました。`;show('result')}
function renderHome(){el('total').textContent=data.answers.length;el('rate').textContent=data.answers.length?Math.round(data.answers.filter(x=>x.ok).length/data.answers.length*100)+'%':'—';let last=data.sessions.at(-1);el('last').textContent=last?`前回：${new Date(last.date).toLocaleDateString('ja-JP')}　${last.correct}/${last.count}問正解`:'まだ学習記録はありません。'}
function renderStats(){el('categoryStats').innerHTML='';cats.forEach((cat,i)=>{let a=data.answers.filter(x=>bank[x.id][0]===i),pct=a.length?Math.round(a.filter(x=>x.ok).length/a.length*100):0;let box=document.createElement('div');box.style.margin='17px 0';box.innerHTML=`<div class="row"><strong style="font-size:13px">${cat}</strong><span class="muted">${a.length?pct+'%':'未学習'} (${a.length}問)</span></div><div class="bar"><span style="width:${pct}%"></span></div>`;el('categoryStats').append(box)});el('history').innerHTML=data.sessions.length?data.sessions.slice(-10).reverse().map(s=>`<div class="row"><span class="small">${new Date(s.date).toLocaleString('ja-JP')}　${s.review?'復習':'演習'} / ${s.mode==='tf'?'○×':'4択'}</span><strong>${s.correct}/${s.count}</strong></div>`).join(''):'まだ履歴はありません。'}
function exportData(){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='fp-study-2-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
el('category').innerHTML='<option value="-1">全6分野</option>'+cats.map((c,i)=>`<option value="${i}">${c}</option>`).join('');renderHome();
</script></body></html>
